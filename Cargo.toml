[workspace]
members = ["rust-ws-core", "rust-ws-proxy", "wasmer-test"]
resolver = "2"

[workspace.dependencies]
base64 = "0.22"
sha2 = "0.10"
hex = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tracing = "0.1"

# WASIX patches for Wasmer Edge
[patch.crates-io]
libc = { git = "https://github.com/linairx/wasix-patches.git" }
mio = { git = "https://github.com/linairx/wasix-patches.git" }
socket2 = { git = "https://github.com/linairx/wasix-patches.git" }
tokio = { git = "https://github.com/linairx/wasix-patches.git" }
