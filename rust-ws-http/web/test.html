<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WASM Test</title>
  <style>
    body { font-family: monospace; padding: 20px; background: #1e1e1e; color: #d4d4d4; }
    pre { background: #333; padding: 15px; border-radius: 5px; overflow-x: auto; }
    button { padding: 10px 20px; margin: 5px; cursor: pointer; }
    .success { color: #4ec9b0; }
    .error { color: #f14c4c; }
  </style>
</head>
<body>
  <h1>🧪 rust-ws-http WASM Test</h1>
  <div id="status">Initializing...</div>
  <button id="health-btn" disabled>Test Health</button>
  <button id="sub-btn" disabled>Test Sub</button>
  <pre id="output"></pre>

  <script type="module">
    import { init, runWasix } from "@wasmer/sdk";
    import wasmUrl from "../../target/wasm32-wasip1/release/rust-ws-http.wasm?url";

    const status = document.getElementById("status");
    const output = document.getElementById("output");
    const healthBtn = document.getElementById("health-btn");
    const subBtn = document.getElementById("sub-btn");

    let wasmModule = null;

    async function initWasm() {
      try {
        status.textContent = "Loading Wasmer SDK...";
        await init();

        status.textContent = "Compiling WASM module...";
        wasmModule = await WebAssembly.compileStreaming(fetch(wasmUrl));

        status.textContent = "Ready!";
        status.className = "success";
        healthBtn.disabled = false;
        subBtn.disabled = false;
      } catch (e) {
        status.textContent = "Error: " + e.message;
        status.className = "error";
        console.error(e);
      }
    }

    async function callWasm(request) {
      const instance = await runWasix(wasmModule, {});
      const stdin = instance.stdin.getWriter();
      const encoder = new TextEncoder();

      await stdin.write(encoder.encode(JSON.stringify(request)));
      await stdin.close();

      const result = await instance.wait();

      if (!result.ok) {
        return { ok: false, error: `Exit code: ${result.code}` };
      }

      return JSON.parse(result.stdout);
    }

    healthBtn.addEventListener("click", async () => {
      output.textContent = "Running health...";
      const result = await callWasm({ cmd: "health" });
      output.textContent = JSON.stringify(result, null, 2);
    });

    subBtn.addEventListener("click", async () => {
      output.textContent = "Running sub...";
      const result = await callWasm({
        cmd: "sub",
        server: "test.example.com",
        port: 8388,
        password: "mypassword",
        method: "aes-256-gcm",
        name: "Test Node"
      });
      output.textContent = JSON.stringify(result, null, 2);
    });

    initWasm();
  </script>
</body>
</html>
