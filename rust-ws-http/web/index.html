<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>rust-ws-http Toolkit</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      min-height: 100vh;
      color: #e0e0e0;
    }
    .container {
      max-width: 1000px;
      margin: 0 auto;
      padding: 20px;
    }
    header {
      text-align: center;
      padding: 30px 0;
    }
    header h1 {
      font-size: 2em;
      margin-bottom: 10px;
      background: linear-gradient(90deg, #00d9ff, #00ff88);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    header p { color: #888; }

    .status-bar {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 20px;
      padding: 10px;
      background: rgba(255,255,255,0.05);
      border-radius: 8px;
    }
    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #666;
    }
    .status-ready .status-dot { background: #00ff88; box-shadow: 0 0 10px #00ff88; }
    .status-error .status-dot { background: #ff4444; }
    .status-loading .status-dot { background: #ffaa00; animation: pulse 1s infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }

    .toolbar {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      justify-content: center;
    }
    .toolbar button {
      padding: 8px 16px;
      border: 1px solid #333;
      background: rgba(255,255,255,0.05);
      color: #e0e0e0;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .toolbar button:hover { background: rgba(255,255,255,0.1); border-color: #00d9ff; }

    .tabs {
      display: flex;
      gap: 5px;
      margin-bottom: 20px;
      border-bottom: 1px solid #333;
      padding-bottom: 5px;
    }
    .tab-btn {
      padding: 10px 20px;
      border: none;
      background: transparent;
      color: #888;
      cursor: pointer;
      border-radius: 6px 6px 0 0;
      transition: all 0.2s;
    }
    .tab-btn:hover { color: #e0e0e0; background: rgba(255,255,255,0.05); }
    .tab-btn.active { color: #00d9ff; background: rgba(0,217,255,0.1); }

    .panel { display: none; }
    .panel.active { display: block; }

    .card {
      background: rgba(255,255,255,0.03);
      border: 1px solid #333;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
    }
    .card h3 {
      margin-bottom: 15px;
      color: #00d9ff;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 15px;
    }
    .form-group label {
      display: block;
      margin-bottom: 5px;
      color: #888;
      font-size: 0.9em;
    }
    .form-group input {
      width: 100%;
      padding: 10px;
      border: 1px solid #333;
      border-radius: 6px;
      background: rgba(0,0,0,0.3);
      color: #e0e0e0;
      font-size: 14px;
    }
    .form-group input:focus {
      outline: none;
      border-color: #00d9ff;
    }
    .form-group input::placeholder { color: #555; }

    .btn-row {
      display: flex;
      gap: 10px;
      margin-top: 15px;
    }
    .btn-primary {
      padding: 12px 24px;
      background: linear-gradient(90deg, #00d9ff, #00ff88);
      border: none;
      border-radius: 6px;
      color: #1a1a2e;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.2s;
    }
    .btn-primary:hover { transform: scale(1.02); }
    .btn-secondary {
      padding: 12px 24px;
      background: rgba(255,255,255,0.1);
      border: 1px solid #333;
      border-radius: 6px;
      color: #e0e0e0;
      cursor: pointer;
    }

    .output-section {
      margin-top: 20px;
    }
    .output-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }
    .output-header h4 { color: #888; }
    #output {
      background: #0d0d0d;
      border: 1px solid #333;
      border-radius: 8px;
      padding: 15px;
      font-family: 'Monaco', 'Consolas', monospace;
      font-size: 13px;
      white-space: pre-wrap;
      word-break: break-all;
      min-height: 200px;
      max-height: 400px;
      overflow: auto;
    }

    .full-width { grid-column: 1 / -1; }

    footer {
      text-align: center;
      padding: 30px;
      color: #555;
      font-size: 0.9em;
    }
    footer a { color: #00d9ff; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>🦀 rust-ws-http Toolkit</h1>
      <p>WebSocket Proxy Tools - Powered by WASIX</p>
    </header>

    <div class="status-bar">
      <div class="status-dot"></div>
      <span id="status-text">Loading...</span>
    </div>

    <div class="toolbar">
      <button id="health-btn">💚 Health</button>
      <button id="help-btn">📖 Help</button>
    </div>

    <div class="tabs">
      <button class="tab-btn active" data-panel="panel-generate">📝 Generate</button>
      <button class="tab-btn" data-panel="panel-parse">🔍 Parse</button>
    </div>

    <!-- Generate Panel -->
    <div id="panel-generate" class="panel active">
      <div class="card">
        <h3>Node Configuration</h3>
        <div class="form-grid">
          <div class="form-group">
            <label>UUID</label>
            <input type="text" id="uuid" placeholder="7bd180e8-1142-4387-93f5-03e8d750a896">
          </div>
          <div class="form-group">
            <label>Host</label>
            <input type="text" id="host" placeholder="example.com">
          </div>
          <div class="form-group">
            <label>Port</label>
            <input type="number" id="port" placeholder="443">
          </div>
          <div class="form-group">
            <label>Name</label>
            <input type="text" id="name" placeholder="My Proxy Node">
          </div>
          <div class="form-group">
            <label>WebSocket Path (optional)</label>
            <input type="text" id="ws-path" placeholder="auto-generated from UUID">
          </div>
        </div>
        <div class="btn-row">
          <button class="btn-primary" id="urls-btn">Generate URLs</button>
          <button class="btn-primary" id="sub-btn">Generate Subscription</button>
        </div>
      </div>
    </div>

    <!-- Parse Panel -->
    <div id="panel-parse" class="panel">
      <div class="card">
        <h3>Parse Proxy URL</h3>
        <div class="form-grid">
          <div class="form-group full-width">
            <label>Proxy URL</label>
            <input type="text" id="parse-url" placeholder="vless://uuid@host:port?params#name">
          </div>
        </div>
        <div class="btn-row">
          <button class="btn-primary" id="parse-btn">Parse URL</button>
        </div>
      </div>
    </div>

    <!-- Output Section -->
    <div class="output-section">
      <div class="output-header">
        <h4>Output</h4>
        <button class="btn-secondary" id="copy-btn">📋 Copy</button>
      </div>
      <div id="output">Ready...</div>
    </div>

    <footer>
      <p>Powered by <a href="https://wasmer.io" target="_blank">Wasmer</a> | <a href="https://github.com/linairx/rust-ws" target="_blank">GitHub</a></p>
    </footer>
  </div>

  <script type="module" src="./index.ts"></script>
</body>
</html>
