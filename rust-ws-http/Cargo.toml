[package]
name = "rust-ws-http"
version = "0.1.0"
edition = "2021"
description = "HTTP service for Wasmer Edge"

# This package is independent from the workspace
[workspace]

[dependencies]
rust-ws-core = { path = "../rust-ws-core" }
axum = { version = "0.7", features = ["tokio"] }
serde = { version = "1.0", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt"] }
tokio = { version = "1", features = ["full"] }
base64 = "0.22"

# For WASIX build, uncomment the following and comment out the standard dependencies above:
# [dependencies]
# rust-ws-core = { path = "../rust-ws-core" }
# axum = { version = "=0.6.9", features = ["tokio", "json"] }
# serde = { version = "1.0", features = ["derive"] }
# tracing = "0.1"
# tracing-subscriber = { version = "0.3", features = ["fmt"] }
# tokio = { version = "=1.24.2", default-features = false, features = ["full"] }
# parking_lot = { version = "=0.12.1", features = ["nightly"] }
# base64 = "0.22"

