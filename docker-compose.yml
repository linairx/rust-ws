services:
  rust-ws-proxy:
    build: .
    image: rust-ws-proxy:latest
    container_name: rust-ws-proxy
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    environment:
      - UUID=${UUID:-7bd180e8-1142-4387-93f5-03e8d750a896}
      - PORT=${PORT:-3000}
      - DOMAIN=${DOMAIN:-}
      - SUB_PATH=${SUB_PATH:-sub}
      - NAME=${NAME:-}
      - WS_PATH=${WS_PATH:-7bd180e8}
      - AUTO_ACCESS=${AUTO_ACCESS:-false}
      - DEBUG=${DEBUG:-false}
      - ALLOW_SHADOWSOCKS=${ALLOW_SHADOWSOCKS:-false}
      - ARGO_ENABLED=${ARGO_ENABLED:-false}
      - ARGO_DOMAIN=${ARGO_DOMAIN:-}
      - ARGO_AUTH=${ARGO_AUTH:-}
      - CLOUDFLARED_PATH=${CLOUDFLARED_PATH:-cloudflared}
      - FILE_PATH=${FILE_PATH:-.tmp}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:${PORT:-3000}/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
